<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento confirmado — MFRGS</title>
  <style>
    :root{color-scheme:dark;--bg:#04070a;--panel:#0b1110;--line:#20302b;--text:#eef2f0;--muted:#98a6a0;--green:#00e6a0;--gold:#d4af6a;--danger:#ff6462}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(0,230,160,.12),transparent 35%),radial-gradient(circle at 90% 90%,rgba(212,175,106,.1),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
    .card{width:min(680px,100%);padding:42px;border:1px solid rgba(0,230,160,.2);border-radius:20px;background:rgba(11,17,16,.92);box-shadow:0 24px 80px rgba(0,0,0,.35);text-align:center}.mark{width:64px;height:64px;margin:0 auto 24px;display:grid;place-items:center;border-radius:50%;background:rgba(0,230,160,.12);color:var(--green);font-size:30px;border:1px solid rgba(0,230,160,.3)}
    h1{margin:0 0 14px;font-size:clamp(28px,5vw,42px)}p{color:var(--muted);line-height:1.7}.status{margin-top:24px;padding:16px;border-radius:10px;background:rgba(255,255,255,.04);color:var(--muted)}.session{margin-top:12px;font:12px/1.5 ui-monospace,monospace;word-break:break-all}.actions{display:grid;gap:12px;margin-top:24px}button,a{display:inline-block;padding:13px 22px;border:0;border-radius:10px;background:var(--green);color:#04120c;text-decoration:none;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.secondary{background:rgba(255,255,255,.08);color:var(--text)}.hidden{display:none}.error{color:#ffb2b0}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">✓</div>
    <h1>Pagamento confirmado</h1>
    <p>Seu pedido foi confirmado. Estamos concluindo a verificação e preparando seu dossiê.</p>
    <div class="status" id="status">Validando o pedido e consultando as fontes oficiais…</div>
    <div class="session" id="session"></div>
    <div class="actions hidden" id="actions">
      <button id="download" type="button">Baixar laudo em PDF</button>
      <a class="secondary" href="/">Voltar para a MFRGS</a>
    </div>
  </main>
<script>
const sessionId = new URLSearchParams(window.location.search).get('session_id');
const statusEl = document.getElementById('status');
const sessionEl = document.getElementById('session');
const actions = document.getElementById('actions');
const download = document.getElementById('download');

if (!sessionId) {
  statusEl.textContent = 'Não foi possível identificar o pedido. Entre em contato com o suporte.';
  statusEl.classList.add('error');
} else {
  sessionEl.textContent = `Pedido Stripe: ${sessionId}`;
  let attempts = 0;
  const maxAttempts = 12;

  async function checkReport() {
    attempts += 1;
    try {
      const response = await fetch('/api/report', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: sessionId})
      });
      const data = await response.json();
      if (response.ok) {
        statusEl.textContent = 'Verificação concluída. Seu laudo está pronto.';
        actions.classList.remove('hidden');
        return;
      }
      if (response.status === 402 || response.status === 503) {
        if (attempts < maxAttempts) {
          statusEl.textContent = 'Pagamento confirmado. Aguardando a conclusão do processamento…';
          setTimeout(checkReport, 2500);
          return;
        }
      }
      throw new Error(data.error || 'Não foi possível concluir a verificação.');
    } catch (error) {
      if (attempts < maxAttempts) {
        statusEl.textContent = 'Processamento em andamento. Vamos tentar novamente automaticamente…';
        setTimeout(checkReport, 2500);
      } else {
        statusEl.textContent = error.message || 'O processamento precisa de uma nova tentativa.';
        statusEl.classList.add('error');
      }
    }
  }

  download.addEventListener('click', async () => {
    download.disabled = true;
    download.textContent = 'Preparando PDF…';
    try {
      const response = await fetch('/api/pdf', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: sessionId})
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'Falha ao gerar o PDF.');
      }
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'MFRGS-Verification-Report.pdf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      download.textContent = 'PDF pronto — baixar novamente';
    } catch (error) {
      download.disabled = false;
      download.textContent = 'Baixar laudo em PDF';
      statusEl.textContent = error.message || 'Falha ao gerar o PDF.';
      statusEl.classList.add('error');
    }
  });

  checkReport();
}
</script>
</body>
</html>
