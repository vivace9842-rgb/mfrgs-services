version: '3.8'

services:
  mfrgs-verifier-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfrgs_verifier_core
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
