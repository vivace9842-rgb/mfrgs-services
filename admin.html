<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>MFRGS</title>
<style>body{font-family:sans-serif;padding:40px;background:#0f172a;color:#fff}table{width:100%;background:#1e293b;border-radius:12px;border-collapse:collapse}th{background:#334155;padding:14px;text-align:left}td{padding:14px;border-bottom:1px solid #334155}.vazio{text-align:center;padding:40px;color:#94a3b8}</style>
</head>
<body>
<h1>💰 MFRGS - Vendas</h1>
<button onclick="location.reload()" style="background:#3b82f6;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;margin-bottom:20px">🔄 Atualizar</button>
<table><thead><tr><th>Data</th><th>Email</th><th>Valor</th><th>Status</th></tr></thead><tbody id="b"><tr><td colspan="4" class="vazio">Carregando...</td></tr></tbody></table>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
const supabase = createClient('https://ggbhtrybmjzyalsrjxtg.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnYmh0cnlibWp6eWFsc3JqeHRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzczMjUsImV4cCI6MjA5NjQ1MzMyNX0.A-SWQJy_4it4azN2HKIXgfzTfcz9aFbwaqlZw09QDg0')
const el = document.getElementById('b')
const { data, error } = await supabase.from('orders').select('*').order('created_at',{ascending:false})
if(error){ el.innerHTML = `<tr><td colspan=4>Erro: ${error.message}</td></tr>` }
else if(!data.length){ el.innerHTML = `<tr><td colspan=4 class=vazio>Nenhuma venda ainda</td></tr>` }
else { el.innerHTML = data.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('pt-BR')}</td><td>${o.email||'--'}</td><td>$${o.amount||0}</td><td>${o.status}</td></tr>`).join('') }
</script>
</body>
</html>
