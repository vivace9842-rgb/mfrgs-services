<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFRGS Digital Verification — Global Business Intelligence</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header / Branding -->
    <header class="border-b border-slate-800 py-6 px-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-teal-400">MFRGS INOVAÇÕES</h1>
            <span class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">Global Coverage Area</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto w-full px-4 py-12 flex-grow flex flex-col justify-center">
        <div class="bg-slate-850 p-8 rounded-2xl border border-slate-800 shadow-xl bg-slate-800/50 backdrop-blur-sm">
            <h2 class="text-2xl font-bold text-white mb-2 text-center">Instant Business Verification</h2>
            <p class="text-slate-400 text-sm mb-6 text-center">Get official corporate intelligence data and risk assessment compliance reports within seconds.</p>

            <!-- Verification Form -->
            <form id="verificationForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Your Professional Email</label>
                    <input type="email" id="email" required placeholder="name@company.com" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-teal-500 transition-colors">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Target Company Legal Name</label>
                    <input type="text" id="company" required placeholder="e.g., Target Corp LLC" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-teal-500 transition-colors">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Company Number</label>
                        <input type="text" id="number" required placeholder="e.g., EXT-9982" 
                               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-teal-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Jurisdiction / Country</label>
                        <select id="country" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-teal-500 transition-colors">
                            <option value="United States">United States</option>
                            <option value="Europe">Europe (EU Region)</option>
                            <option value="North Africa">North Africa</option>
                        </select>
                    </div>
                </div>

                <button type="submit" 
                        class="w-full bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold py-3 rounded-lg mt-6 shadow-lg shadow-teal-500/20 transition-all cursor-pointer text-center block">
                    Verify & Generate Report
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 MFRGS INOVAÇÕES. All professional rights reserved. Legal Registry Infrastructure.</p>
    </footer>

    <!-- Form Router Script -->
    <script>
        document.getElementById('verificationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = encodeURIComponent(document.getElementById('email').value);
            const company = encodeURIComponent(document.getElementById('company').value);
            const number = encodeURIComponent(document.getElementById('number').value);
            const country = encodeURIComponent(document.getElementById('country').value);
            
            // Redireciona para a tela de sucesso passando os parâmetros via Query String
            window.location.href = `/success.html?email=${email}&company=${company}&number=${number}&country=${country}`;
        });
    </script>
</body>
</html>
