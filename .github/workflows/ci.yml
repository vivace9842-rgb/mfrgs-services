name: MFRGS Engine CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar TypeScript
        run: npm run build

      - name: Construir Imagem Docker
        run: docker build -t mfrgs-verification-engine:${{ github.sha }} .
